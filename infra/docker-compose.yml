services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aihuishou_workflow
      POSTGRES_USER: aihuishou
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aihuishou -d aihuishou_workflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: local-aihuishou
      MINIO_ROOT_PASSWORD: local-development-only-change-before-use
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
